<!doctype html>
<html lang="en-IN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline — DigiRise India</title>
  <meta name="theme-color" content="#080604">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: #080604;
      color: #f0ebe0;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      text-align: center;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #110e0a;
      border: 1px solid rgba(255, 255, 255,0.15);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .icon {
      width: 72px; height: 72px; background: rgba(255, 255, 255,0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
      color: #ffffff; font-size: 32px; border: 1px solid rgba(255, 255, 255,0.2);
    }
    h1 { font-size: 24px; font-weight: 800; color: #ffffff; margin-bottom: 12px; }
    p { color: #8a7a60; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      text-decoration: none; padding: 14px; border-radius: 14px;
      font-weight: 700; font-size: 15px; transition: all 0.2s; border: none; cursor: pointer;
    }
    .btn-primary { background: linear-gradient(135deg, #e09d20, #b46414); color: #fff; box-shadow: 0 4px 14px rgba(180,100,20,0.3); }
    .btn-wa { background: #128C7E; color: #fff; box-shadow: 0 4px 14px rgba(18,140,126,0.3); }
    .btn-outline { background: transparent; color: #f0ebe0; border: 1px solid rgba(255,255,255,0.1); }
    .packages { text-align: left; background: rgba(255,255,255,0.03); border-radius: 16px; padding: 16px; margin-bottom: 24px; }
    .packages h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #ffffff; margin-bottom: 12px; }
    .packages ul { list-style: none; }
    .packages li { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #d8cdb8; }
    .packages li span:last-child { font-weight: 700; color: #fff; }
  </style>
<script>if(window.top!==window.self){window.top.location=window.self.location;}</script>
</head>
<body>
  <main class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c3.18 0 6.17 1.34 8.37 3.53M17.44 16.1A6 6 0 0 0 18 13c0-1.65-.67-3.15-1.76-4.24M1.11 1.11l21.78 21.78M5 12a10 10 0 0 0-3.41 1.76M8.56 12.65a6 6 0 0 0-1.8 1.11M12 20h.01"/></svg>
    </div>
    <h1>Aap offline hain!</h1>
    <p>Lekin hum yahin hain. Jaise hi internet wapas aayega, page automatically reload ho jayega.</p>
    
    <div class="packages">
      <h3>Quick Pricing</h3>
      <ul>
        <li><span>Starter</span><span>₹7,999</span></li>
        <li><span>Growth</span><span>₹24,999</span></li>
        <li><span>Authority</span><span>₹34,999</span></li>
      </ul>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.location.reload()">🔄 Retry Connection</button>
      <a href="mailto:digiriseindia@gmail.com" class="btn btn-outline">📞 Call Us Direct</a>
    </div>
  </main>
  <script>
    window.addEventListener('online', () => { window.location.reload(); });
  </script>
</body>
</html>
