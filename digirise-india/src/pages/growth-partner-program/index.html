<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growth Partner Program | DigiRise India</title>
  <meta name="description" content="Partner with DigiRise India. Refer clients and earn recurring commissions through our transparent partnership program.">
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <dr-header></dr-header>
  <main>
    <dr-hero 
      headline="Growth Partner Program" 
      subheadline="Earn up to 20% recurring revenue by referring businesses to DigiRise India."
      cta-text="Apply Now"
      cta-link="#apply-partner">
    </dr-hero>
    
    <section class="container" id="apply-partner" style="padding: 4rem 1rem;">
      <h2 style="font-size: var(--text-2xl); color: var(--color-accent); margin-bottom: 2rem; text-align: center;">How It Works</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-bottom: 4rem;">
        <div style="text-align: center;">
          <h3 style="color: var(--color-text); font-size: var(--text-xl); margin-bottom: 1rem;">1. Apply</h3>
          <p style="color: var(--color-text-muted);">Fill out our partner application form. We review all applications within 24 hours.</p>
        </div>
        <div style="text-align: center;">
          <h3 style="color: var(--color-text); font-size: var(--text-xl); margin-bottom: 1rem;">2. Refer</h3>
          <p style="color: var(--color-text-muted);">Use your unique referral link to bring clients who need digital marketing services.</p>
        </div>
        <div style="text-align: center;">
          <h3 style="color: var(--color-text); font-size: var(--text-xl); margin-bottom: 1rem;">3. Earn</h3>
          <p style="color: var(--color-text-muted);">Get paid recurring commissions for the lifetime of the client contract.</p>
        </div>
      </div>
      <div style="text-align: center;">
         <dr-btn href="mailto:digiriseindia@gmail.com?subject=Partner Program Application">Email to Apply</dr-btn>
      </div>
    </section>
  </main>
  <dr-footer></dr-footer>
</body>
</html>
