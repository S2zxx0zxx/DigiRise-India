<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiRise India vs The Rest | Compare Agencies</title>
  <meta name="description" content="See how DigiRise India compares to traditional marketing agencies. Data-driven, transparent, and performance-first.">
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <dr-header></dr-header>
  <main>
    <dr-hero 
      headline="Why Settle for Average?" 
      subheadline="See how our performance-first approach crushes traditional agency models."
      cta-text="Get Your Free Audit"
      cta-link="/audit/index.html">
    </dr-hero>
    
    <section class="container" style="padding: 4rem 1rem;">
      <h2 style="font-size: var(--text-2xl); color: var(--color-accent); margin-bottom: 2rem; text-align: center;">The DigiRise Difference</h2>
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
          <thead>
            <tr style="border-bottom: 2px solid var(--color-accent);">
              <th style="padding: 1rem; color: var(--color-text);">Feature</th>
              <th style="padding: 1rem; color: var(--color-accent);">DigiRise India</th>
              <th style="padding: 1rem; color: var(--color-text-muted);">Traditional Agencies</th>
            </tr>
          </thead>
          <tbody>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <td style="padding: 1rem;">Approach</td>
              <td style="padding: 1rem; font-weight: bold; color: var(--color-text);">Data-driven & Performance-first</td>
              <td style="padding: 1rem; color: var(--color-text-muted);">Guesswork & Vanity Metrics</td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <td style="padding: 1rem;">Transparency</td>
              <td style="padding: 1rem; font-weight: bold; color: var(--color-text);">100% Transparent Dashboards</td>
              <td style="padding: 1rem; color: var(--color-text-muted);">Hidden Fees & Opaque Reports</td>
            </tr>
            <tr style="border-bottom: 1px solid var(--color-border);">
              <td style="padding: 1rem;">Technology</td>
              <td style="padding: 1rem; font-weight: bold; color: var(--color-text);">AI & Automation Powered</td>
              <td style="padding: 1rem; color: var(--color-text-muted);">Manual & Outdated</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <dr-footer></dr-footer>
</body>
</html>
