<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Digital Growth Audit | DigiRise India</title>
  <meta name="description" content="Get a comprehensive free digital marketing audit. Uncover hidden growth opportunities for your brand with our expert analysis.">
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <dr-header></dr-header>
  <main>
    <dr-hero 
      headline="Free Digital Growth Audit" 
      subheadline="We’ll analyze your current marketing stack, SEO presence, and ad accounts to find missed revenue opportunities."
      cta-text="Book Your Audit Now"
      cta-link="#audit-form">
    </dr-hero>
    
    <section class="container" id="audit-form" style="padding: 4rem 1rem;">
      <div style="max-width: 600px; margin: 0 auto; background: var(--color-surface); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--color-border);">
        <h2 style="font-size: var(--text-2xl); color: var(--color-accent); margin-bottom: 1.5rem;">Request Your Audit</h2>
        <form id="growth-audit-form" style="display: flex; flex-direction: column; gap: 1rem;">
          <input type="text" name="name" placeholder="Your Name" required style="padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-background); color: var(--color-text);">
          <input type="email" name="email" placeholder="Work Email" required style="padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-background); color: var(--color-text);">
          <input type="url" name="website" placeholder="Website URL" required style="padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-background); color: var(--color-text);">
          <dr-btn type="submit">Submit Request</dr-btn>
        </form>
      </div>
    </section>
  </main>
  <dr-footer></dr-footer>
</body>
</html>
